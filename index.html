<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desa Potato Head — Bali</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f4efe4;
      --bg-cream: #f5efe6;
      --bg-forest: #1d3321;
      --bg-card: #142417;
      --card-surface: #faf7f0;
      --clay: #b8552f;
      --clay-hover: #9c4321;
      --terracotta: #c27849;
      --ink: #1c1c1c;
      --text-dark: #1e241f;
      --muted: #525953;
      --sand: #c9a26b;
      --border-line: rgba(30, 36, 31, 0.16);
      --serif: "Playfair Display", Georgia, serif;
      --editorial: "Cormorant Garamond", Georgia, serif;
      --sans: "DM Sans", "Plus Jakarta Sans", system-ui, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      font-family: var(--sans);
      color: var(--cream);
      background: var(--bg-forest);
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--sand);
      outline-offset: 3px;
    }

    /* ================= SHARED SCROLL-BLUR HERO + WELCOME BACKGROUND ================= */
    .hero-top-group {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background-color: var(--bg-forest);
    }

    .hero-bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(16, 28, 19, 0.36), rgba(16, 28, 19, 0.68)),
        url("https://lh3.googleusercontent.com/d/1UHWz-n71ZLIXZ-ZIIaLGxK2fAAXqBW0_") center / cover no-repeat,
        linear-gradient(145deg, #1f3a26 0%, #2c4a33 55%, #6e3720 100%);
      opacity: var(--hero-opacity, 1);
      filter: blur(var(--hero-blur, 0px)) saturate(1.06);
      transform: scale(calc(1.04 + var(--hero-blur, 0px) * 0.008));
      transition: opacity 0.25s cubic-bezier(0.25, 0.1, 0.25, 1), filter 0.18s linear, transform 0.18s linear;
      will-change: opacity, filter, transform;
    }

    /* Gradasi penyatu mulus di bagian bawah Welcome menuju section berikutnya */
    .hero-top-group::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 180px;
      background: linear-gradient(to bottom, transparent 0%, rgba(29, 51, 33, 0.68) 58%, var(--bg-forest) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .title-section, .wa-embed-wrap, .reviews-section, .gateway-section {
      position: relative;
      z-index: 1;
    }

    /* 1A. HERO TITLE */
    .title-section {
      min-height: 56vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(48px, 8vw, 96px) clamp(16px, 4vw, 32px) 20px;
    }

    .title-inner {
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .title-kicker {
      font-size: clamp(0.72rem, 1.4vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sand);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .title-divider {
      width: 44px;
      height: 1px;
      background: var(--sand);
      opacity: 0.85;
    }

    .main-title {
      font-family: var(--serif);
      font-weight: 400;
      color: #ffffff;
      font-size: clamp(2.1rem, 6.5vw, 4.2rem);
      line-height: 1.12;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      animation: gentleFloat 7s ease-in-out infinite;
    }

    .title-sub {
      max-width: 44ch;
      font-size: clamp(0.9rem, 1.8vw, 1.08rem);
      line-height: 1.5;
      color: var(--cream);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 1B. WHATSAPP CTA */
    .wa-embed-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 24px;
    }

    .wa-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 13px clamp(20px, 3vw, 28px);
      border-radius: 999px;
      background: var(--clay);
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(0.78rem, 1.5vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .wa-pill-btn:hover {
      background: var(--clay-hover);
      transform: translateY(-2px);
    }

    .wa-pill-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* 1C. GUEST REVIEWS */
    .reviews-section {
      max-width: 1160px;
      margin: 0 auto;
      padding: 8px 0 clamp(32px, 5vw, 56px);
    }

    .reviews-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding: 0 16px;
      margin-bottom: 14px;
    }

    .reviews-header h2 {
      font-family: var(--serif);
      font-size: clamp(1.45rem, 3.2vw, 2.15rem);
      font-weight: 400;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .google-rating-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(20, 36, 26, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #ffffff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: clamp(0.72rem, 1.4vw, 0.84rem);
      font-weight: 500;
      backdrop-filter: blur(6px);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .google-rating-pill:hover {
      background: rgba(20, 36, 26, 0.78);
      border-color: var(--sand);
    }

    .pill-star { color: var(--sand); }

    .reviews-track {
      display: flex;
      align-items: stretch;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 10px clamp(16px, 12vw, 120px) 18px;
    }

    .reviews-track::-webkit-scrollbar { display: none; }

    .review-card-link {
      flex: 0 0 clamp(250px, 44vw, 400px);
      scroll-snap-align: center;
      display: flex;
      text-decoration: none;
      color: var(--ink);
    }

    .review-card {
      position: relative;
      width: 100%;
      background: rgba(244, 239, 228, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0.85;
      transform: scale(0.96);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      transition: transform 0.35s var(--ease), opacity 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
    }

    .review-card-link.is-focused .review-card,
    .review-card-link:hover .review-card {
      opacity: 1;
      transform: scale(1) translateY(-2px);
      background: var(--cream);
      border-color: var(--sand);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
    }

    .review-stars {
      color: var(--clay);
      font-weight: 700;
      font-size: 0.78rem;
    }

    .review-text {
      font-size: clamp(0.82rem, 1.4vw, 0.92rem);
      line-height: 1.5;
    }

    .review-meta {
      margin-top: auto;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — Desa Potato Head Bali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f4efe4;
      --bg-forest: #1d3321;
      --bg-card: #142417;
      --clay: #b8552f;
      --sand: #c9a26b;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-forest);
      color: var(--cream);
      font-family: var(--sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= WELCOME SECTION ================= */
    .welcome-section {
      position: relative;
      background: transparent;
      padding: clamp(56px, 8vw, 100px) clamp(16px, 4vw, 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Grid 4 Gambar Naik Satu per Satu */
    .welcome-gallery {
      width: 100%;
      max-width: 1080px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(12px, 2vw, 22px);
      margin-bottom: clamp(32px, 5vw, 52px);
    }

    .gallery-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 3 / 3.8;
      background: var(--bg-card);
      border: 1px solid rgba(201, 162, 107, 0.3);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
      /* Animasi otomatis naik satu per satu */
      opacity: 0;
      transform: translateY(45px);
      animation: riseUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .gallery-card:nth-child(1) { animation-delay: 0.1s; }
    .gallery-card:nth-child(2) { animation-delay: 0.28s; margin-top: 22px; }
    .gallery-card:nth-child(3) { animation-delay: 0.46s; }
    .gallery-card:nth-child(4) { animation-delay: 0.64s; margin-top: 22px; }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.06);
    }

    .gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(16, 28, 19, 0.68) 0%, transparent 55%);
      pointer-events: none;
    }

    .gallery-tag {
      position: absolute;
      bottom: 12px;
      left: 14px;
      z-index: 2;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cream);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    @keyframes riseUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Teks Tengah Transparan & Fade-In */
    .welcome-text-box {
      max-width: 680px;
      margin: 0 auto;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .fade-text {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInText 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .t-delay-1 { animation-delay: 0.35s; }
    .t-delay-2 { animation-delay: 0.55s; }
    .t-delay-3 { animation-delay: 0.75s; }
    .t-delay-4 { animation-delay: 0.95s; }

    @keyframes fadeInText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sand);
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .welcome-heading {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(1.95rem, 4.4vw, 3.25rem);
      line-height: 1.15;
      color: #ffffff;
      max-width: 19ch;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55);
    }

    .accent-italic {
      font-style: italic;
      color: var(--sand);
    }

    .welcome-divider {
      width: 56px;
      height: 1.5px;
      background: var(--clay);
      margin: 20px auto 16px;
    }

    .welcome-sub {
      font-size: clamp(0.95rem, 1.6vw, 1.08rem);
      line-height: 1.6;
      color: var(--cream);
      max-width: 42ch;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }

    .welcome-cue {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sand);
    }

    /* Panah Bounce Berulang */
    .bounce-arrow {
      display: inline-block;
      font-size: 1rem;
      animation: bounceLoop 1.5s infinite ease-in-out;
    }

    @keyframes bounceLoop {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(7px); }
      60% { transform: translateY(3px); }
    }

    /* Responsif Tablet & HP */
    @media (max-width: 768px) {
      .welcome-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
      .gallery-card:nth-child(2),
      .gallery-card:nth-child(4) {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

  <section class="welcome-section" aria-label="Welcome to Desa Potato Head">
    <!-- 4 Gambar Naik Satu per Satu -->
    <div class="welcome-gallery">
      <div class="gallery-card">
        <img
          src="https://lh3.googleusercontent.com/d/1cTOPf49QUudo8rcnUxXtw06zHtecir-6"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=700&q=80';"
          alt="Staff Potato Head"
          referrerpolicy="no-referrer"
        />
        <span class="gallery-tag">Staff Potato Head</span>
      </div>

      <div class="gallery-card">
        <img
          src="https://lh3.googleusercontent.com/d/1QSZg9C-MrFD5939mtApD_k1neHmb2vwN"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=700&q=80';"
          alt="Hotel Potato Head"
          referrerpolicy="no-referrer"
        />
        <span class="gallery-tag">Hotel Potato Head</span>
      </div>

      <div class="gallery-card">
        <img
          src="https://lh3.googleusercontent.com/d/119sByZlaAAzu6G-qcSao8w5-Vic1yc97"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=700&q=80';"
          alt="Desa Potato Head Bali"
          referrerpolicy="no-referrer"
        />
        <span class="gallery-tag">Desa Potato Head</span>
      </div>

      <div class="gallery-card">
        <img
          src="https://lh3.googleusercontent.com/d/1SFm696EmDadRxr9on5eT0rpZVp6g07vz"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1536935338788-846bb9981813?auto=format&fit=crop&w=700&q=80';"
          alt="Makanan Potato Head"
          referrerpolicy="no-referrer"
        />
        <span class="gallery-tag">Makanan Potato Head</span>
      </div>
    </div>

    <!-- Teks Tengah (Tidak Diubah, Background Transparan, Fade-In & Bounce Arrow) -->
    <div class="welcome-text-box">
      <span class="welcome-eyebrow fade-text t-delay-1">Welcome</span>
      <h2 class="welcome-heading fade-text t-delay-2">
        A place for people, culture and a <em class="accent-italic">brighter tomorrow.</em>
      </h2>
      <div class="welcome-divider fade-text t-delay-2" aria-hidden="true"></div>
      <p class="welcome-sub fade-text t-delay-3">
        Creativity, culture and care, together by the sea in Seminyak.
      </p>
      <div class="welcome-cue fade-text t-delay-4" aria-hidden="true">
        <span>Explore Experiences Below</span>
        <span class="bounce-arrow">&darr;</span>
      </div>
    </div>
  </section>

</body>
</html>
