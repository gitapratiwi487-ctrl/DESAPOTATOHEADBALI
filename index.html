<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desa Potato Head — Good Times, Done Good</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f4efe4;
      --sand: #c9a26b;
      --terracotta: #b8552f;
      --terracotta-hover: #9e4624;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", system-ui, -apple-system, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: var(--sans);
      color: #ffffff;
      background-color: #161412;
    }

    /* ================= HERO CONTAINER ================= */
    .hero-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      background-image: 
        linear-gradient(to bottom, rgba(18, 16, 14, 0.42), rgba(18, 16, 14, 0.68)),
        url("https://lh3.googleusercontent.com/d/1UHWz-n71ZLIXZ-ZIIaLGxK2fAAXqBW0_");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .title-inner {
      width: 100%;
      max-width: min(780px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* ================= ANIMATIONS ================= */
    @keyframes slowFadeUp {
      0% {
        opacity: 0;
        transform: translateY(22px);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes slowKickerReveal {
      0% {
        opacity: 0;
        letter-spacing: 0.28em;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        letter-spacing: 0.16em;
        transform: translateY(0);
      }
    }

    @keyframes slowLineDraw {
      0% {
        width: 0;
        opacity: 0;
      }
      100% {
        width: 44px;
        opacity: 0.85;
      }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    /* ================= TYPOGRAPHY ================= */
    .title-kicker {
      max-width: 100%;
      font-size: clamp(0.72rem, 2vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sand);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
      opacity: 0;
      animation: slowKickerReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    .title-divider {
      height: 1px;
      width: 0;
      background-color: var(--sand);
      opacity: 0;
      animation: slowLineDraw 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    .main-title {
      max-width: 100%;
      font-family: var(--serif);
      font-weight: 400;
      color: #ffffff;
      font-size: clamp(2.1rem, 7.5vw, 4.3rem);
      line-height: 1.12;
      letter-spacing: -0.01em;
      overflow-wrap: break-word;
      word-break: break-word;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      opacity: 0;
      animation:
        slowFadeUp 1.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards,
        gentleFloat 7s ease-in-out 2.5s infinite;
    }

    .title-sub {
      width: 100%;
      max-width: 44ch;
      font-size: clamp(0.92rem, 2.6vw, 1.1rem);
      line-height: 1.5;
      color: var(--cream);
      overflow-wrap: break-word;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
      opacity: 0;
      animation: slowFadeUp 1.9s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }

    /* ================= WHATSAPP CTA BUTTON ================= */
    .wa-cta-wrap {
      margin-top: 16px;
      opacity: 0;
      animation: slowFadeUp 1.9s cubic-bezier(0.16, 1, 0.3, 1) 1.25s forwards;
    }

    .wa-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      min-height: 52px;
      padding: 14px 30px;
      border-radius: 999px;
      background-color: var(--terracotta);
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(0.8rem, 2.2vw, 0.92rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .wa-pill-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .wa-pill-btn:active {
      transform: scale(0.97);
      background-color: var(--terracotta-hover);
    }

    @media (hover: hover) {
      .wa-pill-btn:hover {
        background-color: var(--terracotta-hover);
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      }
    }

    /* ================= ACCESSIBILITY & RESPONSIVE ================= */
    @media (prefers-reduced-motion: reduce) {
      .title-kicker,
      .title-divider,
      .main-title,
      .title-sub,
      .wa-cta-wrap {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .title-divider {
        width: 44px;
      }
    }

    @media (max-width: 820px) {
      .title-inner {
        gap: 11px;
      }
      .wa-pill-btn {
        padding: 13px 24px;
        letter-spacing: 0.1em;
      }
    }

    @media (max-width: 480px) {
      .hero-wrapper {
        padding: 24px 16px;
      }
      .title-inner {
        gap: 9px;
      }
      @keyframes slowKickerReveal {
        0% {
          opacity: 0;
          letter-spacing: 0.2em;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          letter-spacing: 0.11em;
          transform: translateY(0);
        }
      }
      .title-kicker {
        letter-spacing: 0.11em;
      }
      .main-title {
        font-size: clamp(1.85rem, 8.5vw, 2.5rem);
      }
      .wa-pill-btn {
        min-height: 48px;
        padding: 12px 20px;
        gap: 8px;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
      }
      .wa-pill-btn svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>

  <header class="hero-wrapper" aria-label="Hero Section">
    <div class="title-inner">
      <span class="title-kicker">Desa Potato Head &middot; Bali</span>
      <span class="title-divider" aria-hidden="true"></span>
      <h1 class="main-title">Good Times, Done Good</h1>
      <p class="title-sub">A creative village by the ocean where music, art, and sustainability come together.</p>

      <div class="wa-cta-wrap">
        <a
          class="wa-pill-btn"
          href="https://wa.me/6281234567890?text=Hi%20Desa%20Potato%20Head%2C%20I%20would%20like%20to%20chat%20with%20you."
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Chat Us on WhatsApp"
        >
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 3C8.82 3 3 8.82 3 16c0 2.3.6 4.54 1.74 6.52L3.1 28.9l6.56-1.61A12.92 12.92 0 0 0 16 29c7.18 0 13-5.82 13-13S23.18 3 16 3zm0 23.8c-1.95 0-3.86-.52-5.54-1.51l-.4-.24-3.89.95 1.04-3.79-.26-.41A10.74 10.74 0 0 1 5.2 16c0-5.96 4.84-10.8 10.8-10.8S26.8 10.04 26.8 16 21.96 26.8 16 26.8zm5.92-8.09c-.32-.16-1.92-.95-2.22-1.06-.3-.11-.52-.16-.74.16-.22.32-.85 1.06-1.04 1.27-.19.22-.38.24-.7.08-.32-.16-1.37-.5-2.61-1.61-.96-.86-1.61-1.92-1.8-2.24-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.22-.32.32-.54.11-.22.05-.41-.03-.57-.08-.16-.74-1.78-1.01-2.44-.27-.64-.54-.55-.74-.56h-.63c-.22 0-.57.08-.87.41-.3.32-1.14 1.12-1.14 2.72s1.17 3.15 1.33 3.37c.16.22 2.3 3.51 5.57 4.92.78.34 1.39.54 1.86.69.78.25 1.49.21 2.05.13.63-.09 1.92-.78 2.19-1.54.27-.75.27-1.4.19-1.54-.08-.14-.3-.22-.62-.38z"/>
          </svg>
          <span>CHAT US ON WHATSAPP</span>
        </a>
      </div>
    </div>
  </header>

</body>
</html>
